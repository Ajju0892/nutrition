<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoSync — Luminous Engine Smart Home Dashboard</title>
  <meta name="description" content="State-of-the-art smart resource intelligence dashboard orchestrating energy, water, EV charging, and grid load-shedding." />

  <!-- Google Fonts: Space Grotesk & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#006d32",
            "primary-container": "#00d166",
            "on-primary": "#ffffff",
            "on-primary-container": "#005324",
            "primary-fixed": "#64ff92",
            "primary-fixed-dim": "#30e375",
            "on-primary-fixed": "#00210b",
            "on-primary-fixed-variant": "#005224",

            "secondary": "#0059bb",
            "secondary-container": "#0070ea",
            "on-secondary": "#ffffff",
            "on-secondary-container": "#fefcff",
            "secondary-fixed": "#d8e2ff",
            "secondary-fixed-dim": "#adc7ff",
            "on-secondary-fixed": "#001a41",
            "on-secondary-fixed-variant": "#004493",

            "surface": "#f8f9ff",
            "surface-dim": "#cbdbf5",
            "surface-bright": "#f8f9ff",
            "surface-variant": "#d3e4fe",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#eff4ff",
            "surface-container": "#e5eeff",
            "surface-container-high": "#dce9ff",
            "surface-container-highest": "#d3e4fe",

            "on-surface": "#0b1c30",
            "on-surface-variant": "#3c4a3d",
            "outline": "#6c7b6c",
            "outline-variant": "#bbcbb9",

            "inverse-surface": "#213145",
            "inverse-on-surface": "#eaf1ff",
            "inverse-primary": "#30e375",

            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error": "#ffffff",
            "on-error-container": "#93000a"
          },
          fontFamily: {
            "headline": ["Space Grotesk", "sans-serif"],
            "body": ["Inter", "sans-serif"],
            "label": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "full": "9999px"
          }
        }
      }
    };
  </script>
</head>

<body class="bg-surface text-on-surface font-body antialiased min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
